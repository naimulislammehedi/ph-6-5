<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h3 {
            color: peru;
        }

        h3:hover {
            color: tomato;
            background-color: skyblue;
        }

        input:focus {
            color: blue;
            padding-left: 20px;
            border: 1px solid purple;
        }

        a:visited {
            background-color: red;
            font-size: 50px;
            text-decoration: none;
        }

        ul li:last-child {
            color: red;
        }

        li:nth-child(2n) {
            color: purple;
        }

        li:nth-child(2n+1) {
            color: green;
        }
    </style>
</head>
<body>
    <h3>My Heading</h3>

    <input type="text">
    <input type="text">
    <input type="text">

    <a href="https://drive.google.com/drive/folders/1YORnaq7Xdz8LdD7SDQHg3dlSG8t4CcNL">Google</a>

    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
    </ul>
</body>
</html>
